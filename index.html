<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F0E11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SpendTrack" />
  <title>SpendTrack</title>

  <!-- PWA Manifest inline via JS -->
  <link rel="manifest" href="#" id="manifest-placeholder" />

  <!-- App Icon (inline SVG as data URI) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%230F0E11'/%3E%3Ctext x='256' y='320' font-size='260' text-anchor='middle' font-family='Georgia,serif' fill='%23FF6B6B'%3E%24%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0F0E11;
      --surface: #1A191D;
      --surface2: #22212A;
      --border: #2A2830;
      --text: #F5F0E8;
      --muted: #888;
      --dim: #555;
      --accent: #FF6B6B;
      --green: #95D5B2;
      --orange: #FF9F1C;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overscroll-behavior: none;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* HEADER */
    .header {
      padding: calc(var(--safe-top) + 24px) 24px 16px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .logo span { color: var(--accent); }
    .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: 0.5px; font-weight: 300; }

    /* SCROLLABLE CONTENT */
    .content {
      padding: 0 0 calc(var(--safe-bottom) + 80px) 0;
      overflow-y: auto;
    }

    /* CARDS */
    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      margin: 14px 16px 0;
      border: 1px solid var(--border);
    }
    .label {
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    /* BIG AMOUNT */
    .big-amount {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }
    .big-amount.over { color: var(--accent); }

    /* PROGRESS */
    .progress-bar {
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      margin-top: 14px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s ease;
    }
    .budget-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
    }
    .budget-row .left-text { color: var(--muted); }
    .budget-row .right-text { font-weight: 500; }
    .budget-row .right-text.ok { color: var(--green); }
    .budget-row .right-text.over { color: var(--accent); }

    /* CATEGORY CHIPS */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .cat-chip {
      background: var(--surface2);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .cat-chip .ci { font-size: 20px; }
    .cat-chip .cn { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .cat-chip .ca { font-size: 13px; font-weight: 500; margin-top: 2px; }

    /* FORM */
    .form-section { margin: 14px 16px 0; }
    .form-section .label { margin-bottom: 10px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .inp {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--text);
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 100%;
      transition: border 0.2s;
      -webkit-appearance: none;
    }
    .inp:focus { border-color: var(--accent); }
    .inp::placeholder { color: var(--dim); }
    .inp-amt { width: 110px; flex-shrink: 0; }

    .cat-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
      margin-bottom: 12px;
    }
    .cat-scroller::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: var(--surface2);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 7px 13px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .cat-pill.active {
      color: var(--text);
      border-color: var(--accent);
      background: #2A1F1F;
    }

    .add-btn {
      width: 100%;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      letter-spacing: 0.3px;
      -webkit-appearance: none;
    }
    .add-btn:active { transform: scale(0.98); opacity: 0.9; }
    .add-btn.success { background: var(--green); }
    .add-btn.shake { animation: shake 0.35s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

    /* ENTRIES */
    .entries-wrap { margin: 14px 16px 0; }
    .date-hdr {
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 6px 2px;
      display: flex;
      justify-content: space-between;
    }
    .date-hdr .dtotal { color: var(--accent); }
    .entry-item {
      background: var(--surface);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .entry-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .entry-info { flex: 1; min-width: 0; }
    .entry-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .entry-amt {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .del-btn {
      background: none; border: none;
      color: var(--border);
      cursor: pointer;
      font-size: 15px;
      padding: 4px 2px;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .del-btn:active { color: var(--accent); }

    /* EMPTY */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--dim);
    }
    .empty .eicon { font-size: 48px; margin-bottom: 12px; }
    .empty .emsg { font-size: 14px; line-height: 1.6; }

    /* NAV */
    nav {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(var(--safe-bottom) + 10px);
      z-index: 100;
    }
    .nav-btn {
      background: none; border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 11px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.15s;
      padding: 0 24px;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-icon { font-size: 22px; }

    /* BUDGET VIEW */
    .budget-input {
      background: var(--surface2);
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--text);
      font-size: 18px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 100%;
      margin-bottom: 12px;
      -webkit-appearance: none;
    }
    .save-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      padding: 13px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }
    .ghost-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 16px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      margin-top: 12px;
      transition: all 0.15s;
    }
    .ghost-btn:active { border-color: var(--accent); color: var(--accent); }

    .total-banner {
      background: var(--surface2);
      border-radius: 14px;
      padding: 16px;
      margin: 14px 16px 0;
      display: flex;
      justify-content: space-between;
      border: 1px solid var(--border);
    }
    .tb-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
    .tb-val {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      margin-top: 2px;
    }

    .allcat-row { margin-bottom: 14px; }
    .allcat-row .ac-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .allcat-row .ac-name { }
    .allcat-row .ac-amt { color: var(--accent); }
    .allcat-row .ac-pct { color: var(--dim); font-size: 11px; margin-left: 4px; }

    /* INSTALL BANNER */
    .install-banner {
      background: linear-gradient(135deg, #1A191D, #22212A);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 16px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .install-banner .ib-icon { font-size: 28px; flex-shrink: 0; }
    .install-banner .ib-text { flex: 1; }
    .install-banner .ib-title { font-size: 13px; font-weight: 500; }
    .install-banner .ib-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .install-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">spend<span>.</span>track</div>
    <div class="subtitle">Your personal money diary</div>
  </div>
  <div class="content" id="content"></div>
  <nav id="nav"></nav>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const CATS = [
  { name: "Groceries",     icon: "🛒", color: "#95D5B2" },
  { name: "Eating Out",    icon: "🍽️", color: "#FF6B6B" },
  { name: "Coffee",        icon: "☕", color: "#C8A97E" },
  { name: "Fuel",          icon: "⛽", color: "#FF9F1C" },
  { name: "Transport",     icon: "🚌", color: "#4ECDC4" },
  { name: "Fitness",       icon: "🏋️", color: "#B5E8B0" },
  { name: "Entertainment", icon: "🎬", color: "#FF6FCF" },
  { name: "Travelling",    icon: "✈️", color: "#74C0FC" },
  { name: "Shopping",      icon: "🛍️", color: "#FFE66D" },
  { name: "Bills",         icon: "📋", color: "#A8DADC" },
  { name: "Health",        icon: "💊", color: "#F8A5C2" },
  { name: "Fun",           icon: "🎉", color: "#FF9F1C" },
  { name: "Misc",          icon: "📦", color: "#C9B1FF" },
];
const CAT_MAP = Object.fromEntries(CATS.map(c => [c.name, c]));

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let entries = load("st_entries", []);
let budget  = load("st_budget", 0);
let view    = "today";
let formCat = "Groceries";
let deferredPrompt = null;

// ─── UTILS ───────────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n);
const todayKey = () => new Date().toISOString().split("T")[0];
const todayEntries = () => entries.filter(e => e.date === todayKey());
const todayTotal  = () => todayEntries().reduce((s, e) => s + e.amount, 0);
const allTotal    = () => entries.reduce((s, e) => s + e.amount, 0);

function groupByDate(arr) {
  const g = {};
  arr.forEach(e => { if (!g[e.date]) g[e.date] = []; g[e.date].push(e); });
  return Object.entries(g).sort(([a],[b]) => b.localeCompare(a));
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  renderNav();
  if (view === "today")   renderToday();
  if (view === "history") renderHistory();
  if (view === "budget")  renderBudget();
}

function renderNav() {
  document.getElementById("nav").innerHTML = `
    <button class="nav-btn ${view==='today'?'active':''}"    onclick="switchView('today')">
      <span class="nav-icon">🏠</span>Today
    </button>
    <button class="nav-btn ${view==='history'?'active':''}"  onclick="switchView('history')">
      <span class="nav-icon">📋</span>History
    </button>
    <button class="nav-btn ${view==='budget'?'active':''}"   onclick="switchView('budget')">
      <span class="nav-icon">🎯</span>Budget
    </button>`;
}

function renderToday() {
  const te = todayEntries();
  const tt = todayTotal();
  const over = budget > 0 && tt > budget;
  const pct  = budget > 0 ? Math.min((tt / budget) * 100, 100) : 0;
  const left  = budget - tt;
  const barColor = pct >= 100 ? "#FF6B6B" : pct > 70 ? "#FF9F1C" : "#95D5B2";

  const catBreak = CATS.map(c => ({
    ...c, total: te.filter(e => e.category === c.name).reduce((s,e)=>s+e.amount,0)
  })).filter(c => c.total > 0);

  let installBanner = "";
  if (deferredPrompt) {
    installBanner = `<div class="install-banner">
      <div class="ib-icon">📲</div>
      <div class="ib-text">
        <div class="ib-title">Add to Home Screen</div>
        <div class="ib-sub">Install SpendTrack as an app</div>
      </div>
      <button class="install-btn" onclick="installApp()">Install</button>
    </div>`;
  }

  document.getElementById("content").innerHTML = `
    ${installBanner}
    <div class="card">
      <div class="label">spent today</div>
      <div class="big-amount ${over?'over':''}">${fmt(tt)}</div>
      ${budget > 0 ? `
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="budget-row">
          <span class="left-text">Budget: ${fmt(budget)}</span>
          <span class="right-text ${left<0?'over':'ok'}">${left<0?fmt(Math.abs(left))+' over':fmt(left)+' left'}</span>
        </div>` : `
        <button class="ghost-btn" onclick="switchView('budget')">+ Set daily budget</button>`}
    </div>

    ${catBreak.length ? `<div class="card">
      <div class="label">by category</div>
      <div class="cat-grid">
        ${catBreak.map(c=>`<div class="cat-chip">
          <div class="ci">${c.icon}</div>
          <div class="cn">${c.name}</div>
          <div class="ca" style="color:${c.color}">${fmt(c.total)}</div>
        </div>`).join("")}
      </div>
    </div>` : ""}

    <div class="form-section">
      <div class="label">add expense</div>
      <div class="input-row">
        <input id="inp-amt" class="inp inp-amt" type="number" inputmode="decimal" placeholder="$0.00" />
        <input id="inp-desc" class="inp" type="text" placeholder="What did you spend on?" />
      </div>
      <div class="cat-scroller">
        ${CATS.map(c=>`<button class="cat-pill ${formCat===c.name?'active':''}" onclick="setCat('${c.name}')">${c.icon} ${c.name}</button>`).join("")}
      </div>
      <button class="add-btn" id="add-btn" onclick="addEntry()">Add Expense</button>
    </div>

    ${te.length ? `<div class="entries-wrap">
      <div class="date-hdr"><span>Today's transactions</span><span class="dtotal">${fmt(tt)}</span></div>
      ${te.map(e => entryHTML(e)).join("")}
    </div>` : `<div class="empty"><div class="eicon">🧾</div><div class="emsg">No expenses today yet.<br/>Add your first one above!</div></div>`}
  `;

  // attach enter key
  ["inp-amt","inp-desc"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("keydown", e => { if (e.key === "Enter") addEntry(); });
  });
}

function renderHistory() {
  const groups = groupByDate(entries);
  const at = allTotal();
  document.getElementById("content").innerHTML = `
    <div class="total-banner">
      <div><div class="tb-label">All-time total</div><div class="tb-val">${fmt(at)}</div></div>
      <div style="text-align:right"><div class="tb-label">Transactions</div><div class="tb-val">${entries.length}</div></div>
    </div>
    ${groups.length === 0 ? `<div class="empty"><div class="eicon">📊</div><div class="emsg">No spending history yet.</div></div>` :
      `<div class="entries-wrap">
        ${groups.map(([date, dayArr]) => {
          const dt = dayArr.reduce((s,e)=>s+e.amount,0);
          const isToday = date === todayKey();
          const label = isToday ? "Today" : new Date(date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
          return `<div class="date-hdr"><span>${label}</span><span class="dtotal">${fmt(dt)}</span></div>
            ${dayArr.map(e => entryHTML(e)).join("")}`;
        }).join("")}
      </div>`
    }`;
}

function renderBudget() {
  const at = allTotal();
  document.getElementById("content").innerHTML = `
    <div class="card">
      <div class="label">daily budget</div>
      ${budget > 0 ? `
        <div class="big-amount" style="margin-bottom:14px">${fmt(budget)}</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Your daily spending limit. Change it anytime.</p>
        <div>
          <input class="budget-input" id="new-budget" type="number" inputmode="decimal" placeholder="New amount…" />
          <button class="save-btn" onclick="saveBudget()">Update Budget</button>
        </div>` : `
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Set a daily limit to track how much you have left each day.</p>
        <input class="budget-input" id="new-budget" type="number" inputmode="decimal" placeholder="Enter daily budget (e.g. 50)" />
        <button class="save-btn" onclick="saveBudget()">Save Budget</button>`}
    </div>

    ${entries.length > 0 ? `<div class="card" style="margin-top:14px">
      <div class="label">all-time by category</div>
      ${CATS.map(c => {
        const total = entries.filter(e=>e.category===c.name).reduce((s,e)=>s+e.amount,0);
        if (!total) return "";
        const pct = at > 0 ? (total/at)*100 : 0;
        return `<div class="allcat-row">
          <div class="ac-header">
            <span class="ac-name">${c.icon} ${c.name}</span>
            <span><span class="ac-amt">${fmt(total)}</span><span class="ac-pct">(${pct.toFixed(0)}%)</span></span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${c.color}"></div></div>
        </div>`;
      }).join("")}
    </div>` : ""}

    ${deferredPrompt ? `<div class="install-banner" style="margin-top:14px">
      <div class="ib-icon">📲</div>
      <div class="ib-text">
        <div class="ib-title">Install SpendTrack</div>
        <div class="ib-sub">Add to your home screen as an app</div>
      </div>
      <button class="install-btn" onclick="installApp()">Install</button>
    </div>` : ""}
  `;

  const nb = document.getElementById("new-budget");
  if (nb) nb.addEventListener("keydown", e => { if (e.key === "Enter") saveBudget(); });
}

function entryHTML(e) {
  const cat = CAT_MAP[e.category] || CAT_MAP["Other"];
  return `<div class="entry-item">
    <div class="entry-icon" style="background:${cat.color}22">${cat.icon}</div>
    <div class="entry-info">
      <div class="entry-desc">${e.description}</div>
      <div class="entry-meta">${cat.name} · ${e.time}</div>
    </div>
    <div class="entry-amt">${fmt(e.amount)}</div>
    <button class="del-btn" onclick="deleteEntry(${e.id})">✕</button>
  </div>`;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function switchView(v) { view = v; render(); window.scrollTo(0,0); }

function setCat(name) { formCat = name; render(); }

function addEntry() {
  const amtEl  = document.getElementById("inp-amt");
  const descEl = document.getElementById("inp-desc");
  const btn    = document.getElementById("add-btn");
  const amt  = parseFloat(amtEl?.value);
  const desc = descEl?.value.trim();
  if (!amt || amt <= 0 || !desc) {
    if (btn) { btn.classList.add("shake"); setTimeout(()=>btn.classList.remove("shake"),400); }
    return;
  }
  const now = new Date();
  entries.unshift({
    id: Date.now(),
    amount: amt,
    description: desc,
    category: formCat,
    date: todayKey(),
    time: now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}),
  });
  save("st_entries", entries);
  if (btn) { btn.textContent = "✓ Added!"; btn.classList.add("success"); setTimeout(()=>render(),800); }
  else render();
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save("st_entries", entries);
  render();
}

function saveBudget() {
  const val = parseFloat(document.getElementById("new-budget")?.value);
  if (val > 0) { budget = val; save("st_budget", budget); }
  render();
}

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; render(); });
}

// ─── PWA ─────────────────────────────────────────────────────────────────────
// Inline manifest
const manifest = {
  name: "SpendTrack",
  short_name: "SpendTrack",
  description: "Your personal daily spending tracker",
  start_url: "./",
  display: "standalone",
  background_color: "#0F0E11",
  theme_color: "#0F0E11",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%230F0E11'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle' font-family='Georgia,serif' fill='%23FF6B6B'%3E%24%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
  ]
};
const blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
document.getElementById("manifest-placeholder").href = URL.createObjectURL(blob);

// Service Worker (inline via blob)
const swCode = `
const CACHE = 'spendtrack-v1';
const ASSETS = [self.location.href.replace('/sw.js','/')];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
});
`;

if ('serviceWorker' in navigator) {
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swURL  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL).catch(()=>{});
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  render();
});

window.addEventListener('appinstalled', () => { deferredPrompt = null; render(); });

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
</script>
